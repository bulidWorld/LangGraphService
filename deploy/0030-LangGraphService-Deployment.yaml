apiVersion: v1
kind: ConfigMap
metadata:
  name: langgraph-service-config
data:
  # MCP 配置按服务名称组织，可在同一个 JSON 对象中声明多个服务。
  mcp_server.json: |
    {
      "operator-agent-service": {
        "transport": "streamable_http",
        "url": "http://operator-agent-service.monitoring.svc.cluster.local/api/mcp",
        "headers": {
          "Authorization": "Bearer ${MCP_BEARER_TOKEN}"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-service-deployment
  labels:
    app: langgraph-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langgraph-service
  template:
    metadata:
      labels:
        app: langgraph-service
    spec:
      containers:
        - name: agent
          # 替换为实际构建并推送的镜像地址。
          image: registry.example.com/langgraph-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          env:
            - name: MCP_SERVERS_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: langgraph-service-config
                  key: mcp_server.json
            - name: APP_ENV
              value: production
            - name: OPENAI_MODEL
              value: gpt-4o-mini
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langgraph-service-secrets
                  key: OPENAI_API_KEY
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: langgraph-service-secrets
                  key: MCP_BEARER_TOKEN
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: langgraph-service-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: langgraph-service-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: langgraph-service-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: langgraph-service-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langgraph-service-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_POOL_MAX_SIZE
              value: "10"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-service-service
  labels:
    app: langgraph-service
spec:
  type: ClusterIP
  selector:
    app: langgraph-service
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
