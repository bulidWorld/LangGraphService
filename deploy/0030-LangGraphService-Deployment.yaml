apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-service-deployment
  namespace: langgraph-service
  labels:
    app: langgraph-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langgraph-service
  template:
    metadata:
      labels:
        app: langgraph-service
    spec:
      containers:
        - name: agent
          # 替换为实际构建并推送的镜像地址。
          image: lingxi.image.io/kunpeng/agent/langgraph-service/langgraph-service:v0.091
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: langgraph-service-env
            - secretRef:
                name: langgraph-service-secrets
          volumeMounts:
            - name: langgraph-service-secrets
              mountPath: /etc/langgraph-service/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: langgraph-service-secrets
          secret:
            secretName: langgraph-service-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-service-service
  namespace: langgraph-service
  labels:
    app: langgraph-service
spec:
  type: ClusterIP
  selector:
    app: langgraph-service
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
